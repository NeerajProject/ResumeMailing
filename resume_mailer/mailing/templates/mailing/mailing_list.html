{% extends 'mailing/base.html' %}
{% block content %}
<h2>Mailings</h2>
<form method="get" class="mb-3">
    <input type="text" name="q" value="{{ search }}" placeholder="Search..." class="form-control" />
</form>
<a href="{% url 'mailing:mailing_create' %}" class="btn btn-primary mb-3">Create Mailing</a>
<table class="table table-striped">
    <tr><th>Subject</th><th>Status</th><th>Actions</th></tr>
    {% for m in mailings %}
    <tr>
        <td>{{ m.subject }}</td>
        <td>{{ m.status }}</td>
        <td>
            <a href="{% url 'mailing:mailing_edit' m.pk %}">Edit</a> |
            <a href="{% url 'mailing:mailing_delete' m.pk %}">Delete</a>
        </td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
