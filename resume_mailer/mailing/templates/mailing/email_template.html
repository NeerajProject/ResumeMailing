<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 0;
            padding: 0;
        }
        .content {
            background: #fff;
            padding: 20px;
            max-width: 600px;
            margin: 40px auto;
            border-radius: 8px;
            box-shadow: 0 0 5px #ccc;
        }
        h1 {
            color: #007bff;
            font-size: 24px;
        }
        p {
            font-size: 15px;
            color: #333;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="content">
        <h1>Resume Submission</h1>
        <p>Dear Candidate,</p>
        <p>
            We hope this message finds you well.<br>
            Please find the attached resume for your kind consideration.
        </p>
        <p>Best Regards,<br><strong>Your HR Team</strong></p>
        <p style="font-size: 12px; color: #888; margin-top: 30px;">This is an automated email. Please do not reply.</p>
    </div>
</body>
</html>
